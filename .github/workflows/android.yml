name: Android CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Create local.properties and google-services.json
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "keycursor-dummy-project",
            "storage_bucket": "keycursor-dummy-project.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1234567890123456789012",
                "android_client_info": {
                  "package_name": "com.aistudio.keycursor.kxmpzq"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyDummyKeyForGitHubActionsBuildOnly12345"
                }
              ],
              "services": {
                "analytics_service": {
                  "status": 1
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keycursor-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
